# SPDX-License-Identifier: MPL-2.0
# Builds catalog.json from the releases of the applications in apps.json (every
# file verified against NBT Manager's public keys) and the landing page, then
# publishes both to https://nbtfoundry.github.io. Runs on every push to main,
# every 30 minutes (new releases) and by hand. Pull requests build without
# publishing.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The keys the car trusts: a package or release they do not verify is left out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NBTFoundry/manager
          path: manager
          persist-credentials: false
          sparse-checkout: |
            release/apps-public.pem
            release/manager-public.pem
          sparse-checkout-cone-mode: false
      - name: Test
        run: python3 -I -m unittest discover -s tests
      - name: Catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -I tools/build_catalog.py --keys manager/release
          --previous https://nbtfoundry.github.io/catalog.json --output out/catalog.json
      - name: Site
        run: python3 -I tools/render_site.py --catalog out/catalog.json --output _site
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
