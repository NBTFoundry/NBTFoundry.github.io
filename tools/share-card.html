<!-- The link preview, site/assets/share.png (1200x630). A headless window is shorter than its
     --window-size, so render taller and crop:
     chromium-browser --headless=new --allow-file-access-from-files --hide-scrollbars --window-size=1200,800
       --screenshot=share.png tools/share-card.html && magick share.png -crop 1200x630+0+0 site/assets/share.png -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; color: #f2f4f7;
    font: 24px/1.3 system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(55% 45% at 50% 100%, rgb(255 106 26 / 20%), transparent 70%),
      radial-gradient(90% 60% at 50% 0%, rgb(28 105 212 / 30%), transparent 72%),
      #06080b;
    display: flex; flex-direction: column; align-items: center;
  }
  header { display: flex; align-items: center; gap: 14px; margin-top: 44px; font-weight: 600; font-size: 26px; }
  header img { height: 44px; }
  h1 { margin: 22px 0 0; font-size: 58px; font-weight: 700; letter-spacing: -0.03em; }
  p { margin: 12px 0 0; color: #aab3bf; }
  .screen {
    margin-top: 34px; width: 880px; aspect-ratio: 8 / 3; border: 10px solid #040506; border-radius: 10px;
    box-shadow: 0 0 0 1px #2b313a, 0 60px 130px -40px rgb(255 106 26 / 45%); overflow: hidden;
  }
  .screen img { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>
<header><img src="../site/assets/logo-dark.svg" alt="NBTFoundry"></header>
<h1>New apps for your BMW's iDrive screen</h1>
<p>Android Auto · live engine gauges · classic games</p>
<div class="screen"><img src="../site/screens/gauges-drive.webp" alt=""></div>
